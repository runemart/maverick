<!doctype html>
<html lang="no">
  {{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>
  <main id="main">
  <div class="content">
    {{ partial "header.html" . }}
    <section class="archive">
      <header class="archive-header">
        <h1>{{ .Title }}</h1>
        {{ if .Content }}{{ .Content }}{{ end }}
      </header>
      <ul class="archive-list">
        {{ range .Pages.ByDate.Reverse }}
          <li>
            <time class="time archive-date" datetime="{{ dateFormat "2006-01-02" .Date }}">{{ dateFormat "2. Jan 2006" .Date | lower}}</time>
            <a class="archive-title" href="{{ .Permalink }}">{{ .Title }}</a>
          </li>
        {{ end }}
      </ul>
    </section>
  </div>
</main>
{{ partial "footer.html" . }}
</body>
</html>
